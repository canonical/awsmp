[project]
name = "awsmp"
version = "0.1.0"
description = ""
authors = [
    {name = "Thomas Bechtold", email = "thomas.bechtold@canonical.com"},
    {name = "Jess Jang", email = "jess.jang@canonical.com"},
    {name = "Ryan Hill", email = "ryan.hill@canonical.com"},
]
readme = "README.rst"
requires-python = ">=3.10"
dependencies = [
    "boto3>=1.39.3,<2",
    "pydantic>=2.2.0,<3",
    "click>=8.1.6,<9",
    "prettytable>=3.8.0,<4",
    "pyyaml>=6.0.1,<7",
]

[project.scripts]
awsmpcli = "awsmp.cli:main"
awsmp = "awsmp.cli:main"

[dependency-groups]
dev = [
    "black>=26.3.1,<27",
    "pytest>=8.0.0,<9",
    "tox>=4.10.0,<5",
    "tox-uv>=1.16.0,<2",
    "isort>=5.12.0,<6",
    "mypy>=1.6.1,<2",
    "boto3-stubs>=1.39.3,<2",
    "types-pyyaml>=6.0.12.12,<7",
    "pytest-cov>=4.1.0,<5",
    "typing-extensions>=4.8.0,<5",
]

[tool.black]
line-length = 120
extend-exclude = '''
/(
  # The following are specific to Black, you probably don't want those.
  docs
)/
'''

[tool.isort]
profile = "black"
skip_glob = ["docs/*"]

[tool.mypy]
exclude = "docs/"

[tool.uv.build-backend]
module-root = ""


[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"
